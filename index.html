<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <h1 class="text-center">Pricing</h1>
    <p class="text-center">Please checkout out most effective payment models</p>
    <div class="row text-center justify-content-evenly">
      <div class="card col-md-3 col-sm-5 mb-3 me-3">
        <div class="card-header">Free</div>
        <div class="card-body">
          <h1 class="card-title">$0 / mo</h1>
          <ul class="list-unstyled">
            <li>10 GB included</li>
            <li>2 GB of storage</li>
            <li>Email Support</li>
          </ul>
          <button href="#" class="btn btn-outline-primary">
            Sign Up for free
          </button>
        </div>
      </div>
      <div class="card col-md-3 col-sm-5 mb-3 me-3">
        <div class="card-header">Free</div>
        <div class="card-body">
          <h1 class="card-title">$15 / mo</h1>
          <ul class="list-unstyled">
            <li>20 GB included</li>
            <li>10 GB of storage</li>
            <li>Priority Email Support</li>
          </ul>
          <button href="#" class="btn btn-primary">Get Started</button>
        </div>
      </div>
      <div class="card col-md-3 col-sm-10 mb-3 me-3">
        <div class="card-header">Free</div>
        <div class="card-body">
          <h1 class="card-title">$29 / mo</h1>
          <ul class="list-unstyled">
            <li>30 GB included</li>
            <li>15 GB of storage</li>
            <li>Phone & Email Support</li>
          </ul>
          <button href="#" class="btn btn-primary">Contact Us</button>
        </div>
      </div>
    </div>
    <script src="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
